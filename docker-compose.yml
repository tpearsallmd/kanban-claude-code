services:
  kanban:
    build: .
    image: kanban-claude-code:latest
    container_name: kanban
    restart: unless-stopped
    ports:
      - "${KANBAN_HOST_PORT:-5555}:5555"
    volumes:
      - kanban-data:/data
    environment:
      - KANBAN_DATA_FILE=/data/kanban-board.json
      - KANBAN_PORT=5555

volumes:
  kanban-data:
    driver: local
